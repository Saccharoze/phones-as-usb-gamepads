[package]
name = "stonesd"
description = "Sending Stones board daemon: phones in over UDP or WebSocket, HID reports out"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
proto = { path = "../proto" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
mdns-sd = "0.13"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }

[lints]
workspace = true
